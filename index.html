<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر ع الفرازة</title>
<meta name="theme-color" content="#1f523e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="دفتر الفرازة">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a grocer's daily ledger — practical, warm, fast to use one-handed
   IDEA: the shop's notebook (كشكول الحساب) turned into a phone app
   PICTURE: the big net-profit figure with the break-even meter under it
   COLOUR and TYPE: ع الفرازة logo green #1f523e, leaf #769e64, orange #f47b20 on cream; Baloo Bhaijaan 2 (rounded like the logo) + Cairo
   LAYOUT: green header band, one column of cards, fixed bottom tab bar, bottom sheets for forms */
:root{color-scheme:light dark;
--bg:light-dark(#f6f3ea,#0e1611);--card:light-dark(#ffffff,#16211a);--ink:light-dark(#18261d,#ecf2ec);--mut:light-dark(#66756b,#9fb0a4);
--line:light-dark(#e6e1d3,#26352b);--g:#1f523e;--leaf:#769e64;--g2:light-dark(#1f523e,#8cc274);--disp:"Baloo Bhaijaan 2",Cairo,sans-serif;--o:#f47b20;--o2:light-dark(#c2560a,#ff9b4d);--red:light-dark(#c0392b,#ff7a6b);
--soft:light-dark(#ebf1e6,#1a2a21);--osoft:light-dark(#fff1e6,#2e2015);--rsoft:light-dark(#fdecea,#33191a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.top{background:var(--g);color:#fff;padding:14px 16px 16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand img{display:block;height:46px;width:auto}
.brand small{display:block;margin-top:2px;font-family:var(--disp);font-weight:700}
.brand small{opacity:.9;font-size:15px}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.13);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:9px;white-space:nowrap;min-height:40px;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:var(--g)}
.seg2{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;min-height:40px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;font-size:15px}
.seg2 button.on{background:var(--card);color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{border-top:6px solid var(--o)}
.big{font-family:var(--disp);font-size:clamp(42px,12vw,62px);font-weight:800;line-height:1.05;margin:4px 0}
.pos{color:var(--g2)}.neg{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:13px;color:var(--mut)}.stat b{font-family:var(--disp);font-size:22px;font-weight:800}
.h{font-family:var(--disp);font-size:21px;font-weight:800;margin:0 0 8px;line-height:1.3}
.h2{font-size:15px;font-weight:800;margin:14px 0 8px}
.meter{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}.meter i{display:block;height:100%;background:var(--o);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.end{text-align:left;flex:none}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--g2);font-weight:700;white-space:nowrap}
.pill.o{background:var(--osoft);color:var(--o2)}.pill.r{background:var(--rsoft);color:var(--red)}
.btn{border:0;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;font-size:15px}
.btn.o{background:var(--o)}.btn.ghost{background:var(--soft);color:var(--g2)}.btn.del{background:none;color:var(--red)}
.btn.full{width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--mut);min-height:54px;cursor:pointer;padding:2px}
.nav button.on{color:var(--g2)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .plus i{width:54px;height:54px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 16px rgba(244,123,32,.45)}
.nav .plus i svg{width:28px;height:28px;stroke-width:2.6}
.sheet{position:fixed;inset:0;z-index:10}.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-in{position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
@media(prefers-reduced-motion:no-preference){.sheet-in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;min-height:42px;font-weight:700;cursor:pointer;font-size:14px}
.chip small{color:var(--o2);font-weight:800;margin-inline-start:4px}
.chip.o{border-color:var(--o);background:var(--osoft)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);color:var(--g2);font-size:22px;font-weight:800;cursor:pointer;line-height:1}
.step input{width:62px;text-align:center;padding:4px;min-height:40px}
.sumc{background:var(--soft);border:0;margin-top:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.note{font-size:13px;color:var(--mut)}
.warn{background:var(--osoft);color:var(--o2);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:6px;align-items:center;margin-bottom:8px}
.xbtn{width:44px;height:44px;border:0;border-radius:10px;background:var(--rsoft);color:var(--red);font-size:20px;cursor:pointer}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border:0;color:#fff;border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;cursor:pointer;font:700 14px Cairo,sans-serif}
.me img,.me i{width:32px;height:32px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-style:normal;font-weight:800}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}
.login .card{max-width:420px;padding:32px 24px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:12px;padding:10px 20px;min-height:50px;font:700 16px Cairo,sans-serif;cursor:pointer}
.gbtn svg{width:22px;height:22px}
.role{font-size:12px;font-weight:800;padding:1px 10px;border-radius:99px;background:var(--soft);color:var(--g2)}
.by{font-size:12px;color:var(--mut)}
body.noauth .nav,body.noauth #period{display:none}
@media(max-width:420px){.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bar{grid-template-columns:minmax(0,6.5em) minmax(0,1fr) auto}}

/* ===== واتساب ===== */
.wa-fab{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:#25d366;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;padding:0}
.wa-fab svg{width:32px;height:32px}.wa-fab i{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--o);color:#fff;font:800 12px/22px Cairo;font-style:normal;padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
body.waon{overflow:hidden}body.waon #instBar{display:none!important}body.waon .wa-fab{display:none}
.wa{position:fixed;inset:0;z-index:8;background:var(--bg);--wab:light-dark(#efeae2,#0b1410);--win:light-dark(#fff,#1b2a21);--wout:light-dark(#d9fdd3,#1f523e)}
.wa[hidden]{display:none}
.wa-in{height:100%;display:grid;grid-template-columns:1fr;max-width:1300px;margin:0 auto}
@media(min-width:900px){.wa-in{grid-template-columns:380px 1fr;border-inline:1px solid var(--line)}.wa-side{border-inline-end:1px solid var(--line)}}
.wa-side,.wa-main{height:100dvh;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wa-side{background:var(--card)}
.wa-lh{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--g);color:#fff}
.wa-lh b{font:700 20px var(--disp);flex:1}.wa-lh .note{color:#cfe3d3}
.wa-x{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.wa-search{padding:10px 12px 4px}.wa-search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:10px 16px;font-size:15px}
.wa-filt{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}.wa-filt::-webkit-scrollbar{display:none}
.wa-filt button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.wa-filt button small{background:var(--soft);border-radius:99px;padding:0 6px;margin-inline-start:2px;font-weight:800}
.wa-filt button.on{background:var(--g);color:#fff;border-color:var(--g)}.wa-filt button.on small{background:rgba(255,255,255,.2)}
.wa-rows{flex:1;overflow-y:auto;padding-bottom:20px}
.wa-row{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:start;padding:10px 14px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.wa-row:hover{background:var(--soft)}.wa-row.on{background:var(--soft)}
.wa-av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--disp);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 45% 42%),hsl(calc(var(--h) + 40) 55% 52%))}
.wa-av.big{width:64px;height:64px;font-size:28px}
.wa-mid{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.wa-n{display:flex;gap:6px;align-items:center;min-width:0}.wa-n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.wa-n em{font-style:normal;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;background:var(--soft);color:var(--g2);white-space:nowrap}.wa-n em.tgo{background:var(--osoft);color:var(--o2)}.wa-n em.r{background:var(--rsoft);color:var(--red)}.wa-n em.tgc{background:none;color:var(--mut);padding:0}
.wa-mid small{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-me{color:var(--g2);font-weight:700}
.wa-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.wa-end time{font-size:12px;color:var(--mut)}
.wa-end i{min-width:22px;height:22px;border-radius:11px;background:#25d366;color:#fff;font:800 12px/22px Cairo;font-style:normal;text-align:center;padding:0 6px}
.dot{width:10px;height:10px;border-radius:50%;display:block;text-decoration:none}
.s-new.dot{background:var(--o)}.s-wait.dot{background:#9aa9a0}.s-ordered.dot{background:#25d366}.s-done.dot{background:var(--line)}
.wa-empty{text-align:center;color:var(--mut);padding:40px 24px}.wa-empty b{display:block;color:var(--ink);font-size:18px;margin:6px 0}
.wa-hello{display:grid!important;place-items:center;background:var(--wab);text-align:center}.wa-hello b{font:700 22px var(--disp)}
.wa-main{background:var(--wab);position:relative}
.wa-main::before{content:"";position:absolute;inset:0;opacity:.05;pointer-events:none;background-image:radial-gradient(var(--g2) 1.2px,transparent 1.3px);background-size:22px 22px}
.wa-hd{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--g);color:#fff;z-index:1}
.wa-hd .wa-av{width:42px;height:42px;font-size:18px;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.wa-ht{flex:1;border:0;background:none;color:#fff;text-align:start;display:flex;flex-direction:column;cursor:pointer;min-width:0;padding:0}
.wa-ht b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-ht small{color:#cfe3d3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:18px;cursor:pointer;flex:none}
.wa-body{flex:1;display:flex;min-height:0;position:relative}
.wa-msgs{flex:1;overflow-y:auto;padding:12px 10px 16px;display:flex;flex-direction:column;gap:3px}
.wa-day{text-align:center;margin:10px 0 6px}.wa-day span{background:var(--win);color:var(--mut);font-size:12px;font-weight:700;padding:4px 12px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa-b{display:flex}.wa-b.out{justify-content:flex-end}.wa-b.in{justify-content:flex-start}
.wa-bb{max-width:min(78%,520px);background:var(--win);border-radius:12px;padding:6px 9px 4px;box-shadow:0 1px 1px rgba(0,0,0,.1);position:relative;font-size:15px;line-height:1.55}
.wa-b.out .wa-bb{background:var(--wout)}.wa-b.out .wa-bb{border-top-left-radius:3px}.wa-b.in .wa-bb{border-top-right-radius:3px}
.wa-b.out .wa-bb a{color:light-dark(#0b6b4a,#a9e7c1)}
.wa-tx{white-space:normal;overflow-wrap:anywhere}
.wa-t{display:block;text-align:end;font-size:11px;color:var(--mut);margin-top:2px;direction:ltr}
.wa-b.out .wa-t{color:light-dark(#53785f,#b8d6c0)}.wa-tk{margin-inline-start:3px}.wa-tk.read{color:#34b7f1}
.wa-img{display:block;max-width:100%;width:280px;max-height:340px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--soft);min-height:120px}.wa-img.stk{width:130px;min-height:0;background:none}.wa-img.bad{min-height:40px}
.wa-b audio{width:240px;max-width:100%;height:40px}
.wa-doc{display:inline-block;border:0;background:rgba(0,0,0,.06);border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}
.wa-b.rx .wa-bb{background:none;box-shadow:none;padding:0 4px}
.wa-view{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:grid;place-items:center;cursor:zoom-out}.wa-view img{max-width:96vw;max-height:94vh;border-radius:6px}
.wa-closed{position:relative;margin:0 10px 6px;background:var(--osoft);color:var(--o2);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.wa-warnt{position:relative;text-align:center;font-size:12px;color:var(--o2);padding:0 0 6px;background:var(--card)}
.wa-quick{position:relative;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}.wa-quick::-webkit-scrollbar{display:none}
.wa-quick button{flex:none;border:1px solid color-mix(in srgb,var(--g2) 35%,transparent);background:var(--card);color:var(--g2);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wa-comp{position:relative;display:flex;align-items:flex-end;gap:8px;padding:6px 10px calc(10px + env(safe-area-inset-bottom));background:transparent}
.wa-comp textarea{flex:1;resize:none;border:0;background:var(--card);border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.45;max-height:140px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-att{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;cursor:pointer}.wa-send svg{width:22px;height:22px;transform:scaleX(-1)}
.wa-comp.off{opacity:.55}.wa-comp.off .wa-att{pointer-events:none}
.wa-card{width:min(360px,100%);flex:none;overflow-y:auto;background:var(--card);padding:16px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
@media(max-width:899px){.wa-body.card .wa-msgs{display:none}.wa-card{width:100%;border:0}}
.wa-ch{display:flex;gap:12px;align-items:center}.wa-ch b{font-size:19px}
.wa-sec .lbl{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px}
.wa-stb{display:flex;flex-wrap:wrap;gap:6px}.wa-stb button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.wa-stb button.on{background:var(--g);border-color:var(--g);color:#fff}.wa-stb button.s-new.on{background:var(--o);border-color:var(--o)}
.wa-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wa-stats div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}.wa-stats b{font:800 17px Cairo;color:var(--g2)}.wa-stats span{font-size:12px;color:var(--mut)}
.wa-ord{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;margin-bottom:6px;cursor:pointer}.wa-ord small{grid-column:1/-1;color:var(--mut);font-size:12.5px}.wa-ord span{font-size:13px;font-weight:700}
.wa-new{background:var(--soft);border-radius:12px;padding:12px;font-weight:600;color:var(--g2)}
.wa-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}

/* ---------- costing ---------- */

/* ---------- stock ---------- */

/* ---------- site sync ---------- */

    (o.items||[]).forEach(it=>{const p=prod(it.productId);if(!p)return;const s1=pState({...p,web:{...webOf(p),show:true}},n0(it.qty)*uKg(p),st);if(s1==='hide')worst='hide';else if(s1==='soon'&&worst==='ok')worst='soon'});

function range(per){const t=new Date();let a,b='9999';
  if(per==='week'){a=new Date(t);a.setDate(t.getDate()-6);a=iso(a)}
  else if(per==='month')a=iso(new Date(t.getFullYear(),t.getMonth(),1));
  else if(per==='last'){a=iso(new Date(t.getFullYear(),t.getMonth()-1,1));b=iso(new Date(t.getFullYear(),t.getMonth(),0))}
  else a='0000';return[a,b]}
const inR=(d,[a,b])=>d>=a&&d<=b;
function stats(per){const r=range(per);
  const os=S.orders.filter(o=>o.status!=='cancel'&&inR(o.date||'',r)), exAll=S.expenses.filter(e=>inR(e.date||'',r)), ex=exAll.filter(e=>e.cat!=='draw'), draw=exAll.filter(e=>e.cat==='draw').reduce((a,e)=>a+n0(e.amount),0);
  const sales=os.reduce((s,o)=>s+n0(o.total),0), cogs=os.reduce((s,o)=>s+n0(o.cost),0), exp=ex.reduce((s,e)=>s+n0(e.amount),0);
  const ads=ex.filter(e=>e.cat==='ads').reduce((s,e)=>s+n0(e.amount),0);
  return{draw,exAll,os,ex,sales,cogs,gross:sales-cogs,exp,net:sales-cogs-exp,ads,count:os.length,miss:os.filter(o=>o.missingCost).length}}
const adsPays=()=>S.expenses.filter(e=>e.cat==='ads'&&e.date);
function adsIn(a,b){let t=0;adsPays().forEach(e=>{const n=Math.max(1,Math.round(n0(e.days))||1),per=n0(e.amount)/n,st=e.date,en=addD(st,n-1);
  const lo=st>a?st:a,hi=en<b?en:b;if(lo<=hi)t+=per*(Math.round((new Date(hi)-new Date(lo))/864e5)+1)});return t}
const adsMonthly=()=>{const r=adsIn(addD(today(),-29),today());return r>0?r:n0(S.settings.adsDaily)*30};
function adsEnd(){const L=adsPays().filter(e=>n0(e.days)>1).sort((a,b)=>b.date.localeCompare(a.date))[0];return L?addD(L.date,Math.round(n0(L.days))-1):null}

function siteBar(){if(!isStaff())return'';const on=S.settings&&S.settings.siteSync,t=S.pubAt?new Date(S.pubAt):null;

function oStateTxt(o,st){const w=owebOf(o);if(!w.show)return STATE_TXT.off;st=st||stockMap();let worst='ok';(o.items||[]).forEach(it=>{const p=prod(it.productId);if(!p)return;const s1=pState({...p,web:{...webOf(p),show:true}},n0(it.qty)*uKg(p),st);if(s1==='hide')worst='hide';else if(s1==='soon'&&worst==='ok')worst='soon'});
  return worst==='ok'?STATE_TXT.ok:worst==='soon'?'🌐 على الموقع: خلص · بيرجع قريب (صنف فيه خلص)':'🌐 مستخبي من الموقع (صنف فيه خلص)'}

    <div class="end">${u==null?'<span class="pill r">ناقص التكلفة</span>':`<b class="num" style="font-size:20px;color:${mColor(m)}">${fmt1(pr)}</b><div class="note">ربح الوحدة</div>`}</div></div>

    <div class="note">${u==null?'اضغط تعديل وكمّل الخامة واليومية والكمية، أو سجل تجهيزة.':`التكلفة ${fmt1(u)} · هامش ${Math.round(m)}% · ${esc(costSrc(p))}`}</div>
    <div class="btns" style="margin-top:8px"><button class="btn ghost" data-batch="${esc(p.id)}">${isMeat(p)?'سجل استلام':'سجل تجهيزة'}</button><button class="btn ghost" data-pedit="${esc(p.id)}">تعديل</button></div>
    ${S.settings&&S.settings.siteSync?`<div class="note" style="margin-top:6px">${STATE_TXT[pState(p,null,ST)]}</div>`:''}
    <label class="note" style="display:flex;align-items:center;gap:8px;margin-top:8px">القسم:<select data-pmove="${esc(p.id)}" style="flex:1;min-height:38px">${PCK.map(c=>`<option value="${c}" ${pcat(p)===c?'selected':''}>${esc(PCAT[c])}</option>`).join('')}</select></label></div>`}).join('')).join('')

/* ---------- tools: prep, cash, lapsed, ads, week ---------- */
const PAY={cash:'كاش',insta:'إنستاباي',wallet:'محفظة',later:'لسه مادفعش'};
const CASH_START=Date.parse('2026-11-22T00:00:00+02:00');
const ttlOf=nm=>{nm=String(nm||'').trim();return nm?(/^(أ|ا)\s*\/|^(أستاذ|استاذ|مدام|د\s*\/|م\s*\/)/.test(nm)?nm:'أ/ '+nm):''};
const ls={get:(k,d)=>{try{const v=localStorage.getItem('fz_'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set:(k,v)=>{try{localStorage.setItem('fz_'+k,JSON.stringify(v))}catch(_){}}};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};
const isOwnerEmail=e=>{const u=S.users.find(x=>x.id===e);return e===ME.email&&isOwner()||(u&&u.role==='owner')};
const sheetHead=t=>`<div class="row"><h2 class="h" style="margin:0">${t}</h2><button class="btn ghost" data-close>قفل</button></div>`;
const chipRow=(cur,opts,attr)=>`<div class="chips" style="margin:8px 0">${opts.map(([v,l])=>`<button class="chip${String(cur)===String(v)?' o':''}" data-${attr}="${v}">${l}</button>`).join('')}</div>`;
const lineKgs=l=>{if(l.kgs)return l.kgs;const r={};if(l.kind==='p'){const {id,z}=pref(l.ref);if(z)r[id]=n0(l.qty)*n0(z.kg)}else if(l.kind==='o'){const of=offer(l.ref);if(of)(of.items||[]).forEach(it=>{r[it.productId]=(r[it.productId]||0)+n0(it.qty)*uKg(prod(it.productId))*n0(l.qty)})}return r};

/* 1. prep list */
function openPrep(day){day=day||addD(today(),1);
  const pend=S.orders.filter(o=>o.status==='new'),dem={},all={},xs={},list=[],noDate=[];
  pend.forEach(o=>{const inD=o.ddate?o.ddate<=day:false;if(!o.ddate)noDate.push(o);if(inD)list.push(o);
    (o.lines||[]).forEach(l=>{const k=lineKgs(l);Object.entries(k).forEach(([id,v])=>{all[id]=(all[id]||0)+n0(v);if(inD)dem[id]=(dem[id]||0)+n0(v)});
      if(inD&&l.kind==='x'){xs[l.name]=(xs[l.name]||0)+n0(l.qty)}})});
  const m=stockMap(),rows=sortP(S.products).filter(p=>dem[p.id]).map(p=>{const phys=(m[p.id]?m[p.id].qty:0)+(all[p.id]||0),need=Math.max(0,dem[p.id]-phys);return{p,d:dem[p.id],phys,need}});
  const lbl=d=>d===today()?'النهارده':d===addD(today(),1)?'بكرة':d;
  openSheet(`${sheetHead('📋 قايمة التجهيز')}
  ${chipRow(day,[[today(),'النهارده'],[addD(today(),1),'بكرة'],[addD(today(),2),'بعد بكرة']],'pday')}
  <p class="note" style="margin:0 0 8px">كل الأوردرات اللي ميعادها ${lbl(day)} أو قبلها ولسه ما اتسلمتش (${list.length} أوردر). "الموجود" هو اللي في المخزن فعلًا قبل ما الأوردرات تطلع.</p>
  ${rows.length?rows.map(r=>`<div class="it" style="cursor:default"><div><b>${esc(r.p.name)}</b><div class="note">مطلوب ${qTxt(r.p,r.d)} ${packTxt(r.p,r.d)} · الموجود ${qTxt(r.p,r.phys)}</div></div>
    <div class="end">${r.need>0?`<b class="num" style="color:var(--red)">جهّز ${qTxt(r.p,r.need)}</b>`:'<b style="color:var(--g2)">مكفي ✓</b>'}</div></div>`).join(''):'<div class="empty">مفيش أوردرات للميعاد ده.</div>'}
  ${Object.keys(xs).length?`<div class="h2">حاجات هتشتريها من بره</div>${Object.entries(xs).map(([k,v])=>`<div class="row" style="padding:4px 0"><span>${esc(k)}</span><b class="num">× ${fmt1(v)}</b></div>`).join('')}`:''}
  ${list.length?`<div class="h2">الأوردرات</div>${list.sort((a,b)=>((a.ddate||'')+(a.dtime||'')).localeCompare((b.ddate||'')+(b.dtime||''))).map(o=>`<div class="row note" style="padding:4px 0;align-items:flex-start"><span><b style="color:var(--ink)">${esc(o.name||'زبون')}</b> · ${(o.lines||[]).map(l=>`${esc(l.name)} ×${fmt1(n0(l.qty))}`).join('، ')}</span><span style="white-space:nowrap;font-weight:700">${esc(dueTxt(o))}</span></div>`).join('')}`:''}
  ${(()=>{const fc=forecast(day);if(!fc)return '';if(!fc.res)return `<p class="note" style="margin-top:8px">📈 بعد ${3-fc.weeks>0?3-fc.weeks:1} أسبوع كمان من التسجيل، هقولك متوقع يتطلب كام زيادة في اليوم ده.</p>`;
    const R=sortP(S.products).map(p=>({p,f:fc.res[p.id]||0,d:dem[p.id]||0})).filter(r=>r.f>r.d+.01);
    return R.length?`<div class="h2">📈 متوقع يتطلب زيادة (من نفس اليوم في آخر ${fc.weeks} أسابيع)</div>${R.map(r=>`<div class="row" style="padding:4px 0"><span>${esc(r.p.name)} <span class="note">في المتوسط ${qTxt(r.p,r.f)}</span></span><b class="num">+ ${qTxt(r.p,r.f-r.d)}</b></div>`).join('')}<p class="note">ده توقع من اللي فات، جهّز جزء منه احتياطي لو المخزن يسمح.</p>`:''})()}
  ${noDate.length?`<div class="warn" style="margin-top:8px">فيه ${noDate.length} أوردر من غير ميعاد تسليم ومش داخلين في الحسبة. حط لهم ميعاد.</div>`:''}`);
  sheetIn.onclick=e=>{const b=e.target.closest('button');if(!b)return;if('close' in b.dataset)return closeSheet();if(b.dataset.pday)openPrep(b.dataset.pday)}}

/* 2. cash with drivers + unpaid */
const isCash=o=>!o.pay||o.pay==='cash';
const drvKeep=()=>S.settings.drvKeep!==false;
function cashOrders(){return S.orders.filter(o=>o.status==='done'&&!o.settled&&(isCash(o)||(isOnline(o)&&n0(o.delivery)>0&&drvKeep()))&&n0(o.deliveredAt)>=CASH_START&&(o.courierId||(o.deliveredBy&&!isOwnerEmail(o.deliveredBy))))}
function cashBy(){const m={};cashOrders().forEach(o=>{const k=o.courierId?'c:'+o.courierId:o.deliveredBy,x=m[k]||(m[k]={email:k,os:[],got:0,owe:0,dl:0});x.os.push(o);if(isOnline(o)){x.owe-=n0(o.delivery);return}x.got+=n0(o.total)+n0(o.delivery);x.dl+=n0(o.delivery);x.owe+=n0(o.total)+(drvKeep()?0:n0(o.delivery))});return Object.values(m)}
const unpaid=()=>S.orders.filter(o=>o.status!=='cancel'&&o.pay==='later'&&!o.paid);
function openCash(){const D=cashBy(),U=unpaid();
  openSheet(`${sheetHead('💵 حساب المناديب والفلوس')}
  <p class="note" style="margin:4px 0 8px">الأوردرات الكاش اللي المندوب سلّمها وحصّل فلوسها، ولسه ما سلّمكش الفلوس. الأوردرات اللي بعتها لمندوب بتتحسب عليه أول ما تتعلّم "اتسلم". بيبدأ يحسب من 22-11.</p>
  <div class="seg2" style="margin-bottom:8px"><button data-keep="1" class="${drvKeep()?'on':''}">التوصيل للمندوب</button><button data-keep="0" class="${drvKeep()?'':'on'}">التوصيل ليا</button></div>
  ${D.length?D.map(x=>`<div class="card sumc"><div class="row"><b>${esc(drvName(x.email))}</b><b class="num" style="font-size:20px;color:var(--o2)">${x.owe<0?`ليه عندك ${fmt(-x.owe)}`:fmt(x.owe)} جنيه</b></div>
    <div class="note">حصّل ${fmt(x.got)} من ${x.os.filter(o=>!isOnline(o)).length} أوردر كاش${x.dl?` · منهم توصيل ${fmt(x.dl)} ${drvKeep()?'(بتاعه)':''}`:''}</div>
    ${x.os.map(o=>`<div class="row note" style="padding:2px 0"><span>${esc(o.name||'زبون')} · ${esc(o.date)}${isOnline(o)?` · مدفوع ${PAY[o.pay]}، ليه التوصيل`:''}</span><span class="num">${isOnline(o)?'− '+fmt(n0(o.delivery)):fmt(n0(o.total)+n0(o.delivery))}</span></div>`).join('')}
    <button class="btn o full" data-settle="${esc(x.email)}" style="margin-top:8px">${x.owe<0?`دفعتله ${fmt(-x.owe)} جنيه ✓`:x.owe===0?'اتحاسبنا ✓':`استلمت منه ${fmt(x.owe)} جنيه ✓`}</button></div>`).join(''):'<div class="empty">مفيش فلوس مع حد دلوقتي 👌</div>'}
  <div class="h2">أوردرات لسه ما اتدفعتش (${U.length})</div>
  ${U.length?U.map(o=>`<div class="it" style="cursor:default;align-items:center"><div><b>${esc(o.name||'زبون')}</b><div class="note">${esc(o.date)}${o.phone?' · '+esc(o.phone):''}</div></div><div class="end"><b class="num">${fmt(n0(o.total)+n0(o.delivery))}</b><button class="btn ghost" data-paid="${esc(o.id)}" style="min-height:34px;padding:2px 10px;font-size:13px;margin-top:4px">اتدفع ✓</button></div></div>`).join(''):'<div class="note">مفيش.</div>'}`);
  sheetIn.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if('close' in d)return closeSheet();
    if(d.keep){b.disabled=true;await save('settings','main',{...S.settings,drvKeep:d.keep==='1'});setTimeout(openCash,400);return}

  else if(l.kind==='p'){const {p}=pref(l.ref);if(p&&webOf(p).show){const zi=String(l.ref).split('~')[1];parts.push('p:'+siteId(p)+(zi?'~'+zi:'')+'*'+n0(l.qty))}}});return parts.length?SITE_URL+'?re='+encodeURIComponent(parts.join(',')):''}

  sheetIn.oninput=e=>{const t=e.target;if(t.id==='ss_max')C.max=t.value;if(t.id==='ss_insta')P.insta=t.value;if(t.id==='ss_wallet')P.wallet=t.value};

    else if('sssave' in d){b.disabled=true;const ok=await save('settings','main',{...S.settings,cap:{max:n0(C.max),offW:C.offW,offD:C.offD},payInsta:String(P.insta).trim(),payWallet:String(P.wallet).trim()});b.disabled=false;if(ok)closeSheet()}}}

// shared: kg sold per product in a window
function soldMap(from){const m={};S.orders.forEach(o=>{if(o.status==='cancel'||(o.date||'')<from)return;(o.lines||[]).forEach(l=>{
  if(l.kgs){Object.entries(l.kgs).forEach(([id,k])=>m[id]=(m[id]||0)+n0(k));return}
  if(l.kind==='p'){const {id,z}=pref(l.ref);if(id&&z)m[id]=(m[id]||0)+n0(l.qty)*n0(z.kg)}
  else{const of=offer(l.ref);if(of)(of.items||[]).forEach(it=>{const p=prod(it.productId);if(p)m[it.productId]=(m[it.productId]||0)+n0(it.qty)*uKg(p)*n0(l.qty)})}})});return m}

// 2. supplier order
const SUP_MSG='السلام عليكم 🌿\nعايز أطلب:\n{الطلب}\nع الفرازة';
function supPlan(cover,all){const st=stockMap(),sold=soldMap(addD(today(),-14));
  return sortP(S.products).filter(p=>all||catKind(pcat(p))==='recv').map(p=>{const q=(st[p.id]||{qty:0}).qty,rate=n0(sold[p.id])/14,u=uKg(p)||1;
    const need=Math.max(0,rate*cover+n0(p.minStock)-q),units=Math.ceil(need/u-1e-9);return{p,q,rate,units,kg:units*u}})}
function supTxtLine(p,units){return p.measure==='count'?`• ${fmt1(units)} × ${p.unit} ${p.name}`:`• ${kgWord(units*uKg(p))} ${p.name}`}
function openSupplier(cover,all){cover=cover||ls.get('supCover',7);ls.set('supCover',cover);all=all==null?ls.get('supAll',false):all;ls.set('supAll',all);

  ${plan.length?plan.map(x=>`<div class="it" style="cursor:default;align-items:center"><div><b>${esc(x.p.name)}</b><div class="note">في المخزن ${qTxt(x.p,x.q)} · بيتباع ${x.rate>0?qTxt(x.p,x.rate*7)+' في الأسبوع':'لسه مفيش مبيعات'}</div></div>
    <div class="step"><button data-sdq="${esc(x.p.id)}">−</button><input data-sq="${esc(x.p.id)}" type="number" inputmode="decimal" min="0" step="1" value="${x.units}" style="width:56px"><button data-siq="${esc(x.p.id)}">+</button></div></div>
    <div class="note" style="margin:-4px 0 6px;text-align:left" data-skg="${esc(x.p.id)}">${x.units?supTxtLine(x.p,x.units).slice(2):'مش محتاج'}</div>`).join(''):'<div class="empty">مفيش أصناف في الأقسام اللي بنستلمها جاهزة.</div>'}
  <label class="f" style="margin-top:8px"><span>رقم المورد على واتساب</span><input id="sup_ph" inputmode="tel" dir="ltr" value="${esc(ls.get('supPhone',''))}" placeholder="01xxxxxxxxx"></label>
  <details style="margin-bottom:8px"><summary class="note" style="cursor:pointer;font-weight:700">✏️ عدّل الرسالة</summary><textarea id="smsg" rows="5" style="width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:10px;border:1px solid #ccc">${esc(ls.get('supMsg',SUP_MSG))}</textarea><div class="note">{الطلب} بيتبدل بالأصناف والكميات.</div></details>

// 3. customers due to reorder
const DUE_MSG='السلام عليكم يا {الاسم} 🌿\nوحشتينا! تحبي نجهزلك طلبك زي المرة اللي فاتت؟\n({الطلب})\nطلبك جاهز تبعتيه بضغطة من هنا:\n{اللينك}\nع الفرازة 🧡';
function dueCustomers(){const g={};S.orders.forEach(o=>{if(o.status==='cancel')return;const k=ckey(o.name,o.phone);if(!k||!o.date)return;(g[k]=g[k]||[]).push(o)});
  const out=[];const cs=customers();Object.entries(g).forEach(([k,os])=>{const ds=[...new Set(os.map(o=>o.date))].sort();if(ds.length<2)return;
    const gaps=[];for(let i=1;i<ds.length;i++)gaps.push((new Date(ds[i])-new Date(ds[i-1]))/864e5);const last4=gaps.slice(-4).sort((a,b)=>a-b),med=Math.max(3,Math.round(last4[Math.floor((last4.length-1)/2)]));
    const last=ds[ds.length-1],next=addD(last,med),inD=-daysAgo(next);if(inD>1||inD<-Math.max(3,Math.round(med/2)))return;
    if(os.some(o=>o.status==='new'))return;const c=cs.find(x=>x.key===k);if(!c||!c.phone||cmeta(k).tag==='blocked')return;
    const lo=os.filter(o=>o.date===last).pop();out.push({c,med,next,inD,lastLines:(lo&&lo.lines||[]).filter(l=>!l.gift).map(l=>l.name).join('، ')})});
  return out.sort((a,b)=>a.inD-b.inD)}
const dueTxt2=x=>x.inD===1?'المفروض يطلب بكرة':x.inD===0?'المفروض يطلب النهارده':`متأخر ${-x.inD} يوم عن ميعاده`;
function openDue(){const L=dueCustomers(),sent=ls.get('dueSent',{});

  <p class="note" style="margin:0 0 6px">الدفتر بيحسب كل زبون بيطلب كل قد إيه، ويطلعلك اللي ميعاده النهارده أو بكرة أو عدّى بشوية. ابعتلهم قبل ما ينسوا.</p>
  <details style="margin-bottom:8px"><summary class="note" style="cursor:pointer;font-weight:700">✏️ عدّل الرسالة</summary><textarea id="dmsg" rows="6" style="width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:10px;border:1px solid #ccc">${esc(ls.get('dueMsg',DUE_MSG))}</textarea><div class="note">{الاسم} بيتبدل باسم الزبون، و{الطلب} بآخر حاجة طلبها، و{اللينك} بلينك يفتح الموقع وطلبه جاهز.</div></details>
  ${L.length?L.map(x=>{const s=sent[x.c.key]&&daysAgo(sent[x.c.key])<=3?sent[x.c.key]:null;return `<div class="it" style="cursor:default;align-items:center"><div><b>${esc(x.c.name||'من غير اسم')}</b>
    <div class="note" style="color:${x.inD<0?'var(--red)':'var(--o2)'};font-weight:700">${dueTxt2(x)}</div><div class="note">بيطلب كل ${x.med} يوم تقريبًا · آخر مرة: ${esc(x.lastLines||'—')}</div>${s?`<div class="note" style="color:var(--g2);font-weight:700">اتبعتله ${daysAgo(s)?'من '+daysAgo(s)+' يوم':'النهارده'}</div>`:''}</div>
    <div class="end"><button class="btn ${s?'ghost':'o'}" data-dsend="${esc(x.c.key)}" style="min-height:36px;padding:4px 12px;font-size:13px">واتساب</button></div></div>`}).join(''):'<div class="empty">مفيش حد ميعاده قرّب دلوقتي 👌</div>'}`);
  sheetIn.oninput=e=>{if(e.target.id==='dmsg')ls.set('dueMsg',e.target.value)};

function agingStock(){const st=stockMap(),out=[];S.products.forEach(p=>{const shelf=n0(p.shelfDays);if(!shelf)return;let q=(st[p.id]||{qty:0}).qty;if(q<=1e-6)return;
  const bs=batchesOf(p.id);if(!bs.length)return;let oldest=null;for(const b of bs){oldest=b;q-=bKg(b,p);if(q<=1e-6)break}
  const age=daysAgo(oldest.date),warn=shelf>30?shelf-14:Math.max(1,shelf-1);if(age>=warn)out.push({p,age,shelf,left:shelf-age})});
  return out.sort((a,b)=>a.left-b.left)}

const nArab=t=>String(t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

function qtyAround(t,s,e){const before=t.slice(Math.max(0,s-16),s),after=t.slice(e,e+16);let q=null,kg=false;
  let m=before.match(/(\d+(?:\.\d+)?)\s*(كيلو|ك|كجم|جرام|جم|علبه|علب|طبق|حزمه|حزم|برطمان)?\s*(?:من\s*)?$/);
  if(m){q=+m[1];if(m[2]&&/جرام|جم/.test(m[2])){q/=1000;kg=true}else if(m[2]&&/كيلو|ك|كجم/.test(m[2]))kg=true}
  if(q==null){m=before.match(/(نص|نصف|ربع|واحده|واحد|اتنين|اثنين|تلاته|ثلاثه|اربعه|خمسه|سته)\s*(كيلو)?\s*$/);if(m){q=WN[m[1]];kg=!!m[2]||m[1]==='نص'||m[1]==='ربع'||m[1]==='نصف'}}
  if(q==null){m=after.match(/^\s*[:×x*-]?\s*(\d+(?:\.\d+)?)\s*(كيلو|ك|كجم|جرام|جم)?/);if(m){q=+m[1];if(m[2]&&/جرام|جم/.test(m[2])){q/=1000;kg=true}else if(m[2])kg=true}}
  if(q!=null&&/^\s*(كيلو)?\s*و\s*نص(\s*كيلو)?\s*([\n،,.!؟]|$)/.test(after)){q+=.5;kg=true}
  return{q:q==null?1:q,kg}}
function parseMsg(raw){const r0=nArab(raw),t=nLet(r0),out={phones:[],items:[],name:'',address:'',area:''},orig=m=>{const st=m.index+m[0].lastIndexOf(m[1]);return r0.substr(st,m[1].length).trim()};

  m=t.match(/(?:العنوان|عنواني|عنوان)\s*[:：\-]?\s*([^\n]{3,120})/);if(m)out.address=orig(m);
  else{const ls2=t.split('\n'),i2=ls2.findIndex(l=>/(شارع|ش\.|عماره|برج|الحي|حي |منطقه|بجوار|جنب|امام|خلف|الدور|شقه)/.test(l));if(i2>=0)out.address=r0.split('\n')[i2].trim()}
  const areas=[...new Set(customers().map(c=>c.area).filter(Boolean))];const ar=areas.sort((a,b)=>b.length-a.length).find(a=>t.includes(nLet(a)));if(ar)out.area=ar;
  const cands=[];S.offers.forEach(o=>cands.push({k:'o:'+o.id,name:o.name,o}));

  const used=[];const free=(s,e)=>!used.some(([a,b])=>s<b&&e>a);
  cands.map(c=>({...c,key:nLet(String(c.name).trim()).replace(/^ال/,'')})).filter(c=>c.key.length>=2).sort((a,b)=>b.key.length-a.key.length).forEach(c=>{

      else out.items.push({k:c.k,qty:q,label:`${c.name} × ${fmt1(q)}`})}
      i=t.indexOf(c.key,e)}});
  return out}

function forecast(day){const firstD=S.orders.map(o=>o.date).filter(Boolean).sort()[0];if(!firstD)return null;const res={};let weeks=0;
  for(let k=1;k<=8;k++){const d=addD(day,-7*k);if(d<firstD)break;if(d>=today())continue;weeks++;
    S.orders.filter(o=>o.status!=='cancel'&&(o.ddate||o.date)===d).forEach(o=>(o.lines||[]).forEach(l=>Object.entries(lineKgs(l)).forEach(([id,v])=>res[id]=(res[id]||0)+n0(v))))}
  if(weeks<3)return{weeks};Object.keys(res).forEach(id=>res[id]/=weeks);return{weeks,res}}

/* ---------- batch sheet ---------- */

    <div class="end"><b class="num">${n0(b.yieldKg)&&n0(b.raw)>0?fmt1((n0(b.raw)+n0(b.labor))/n0(b.yieldKg)):'—'}</b><div class="note">للكيلو</div><button class="btn del" data-bdel="${esc(b.id)}" style="min-height:36px;padding:2px 6px">مسح</button></div></div>`).join('');
  openSheet(`<div class="row"><h2 class="h" style="margin:0">${isMeat(p)?'استلام':'تجهيزة'} ${esc(p.name)}</h2><button class="btn ghost" data-close>قفل</button></div>
  <p class="note">الكمية بس هي المطلوبة. لو فاكر دفعت كام في الخامة اكتبه، ولو مش فاكر (زي حاجة متجهزة من زمان) سيبه فاضي، والتجهيزة هتتضاف للمخزن عادي ومش هتأثر على حساب التكلفة.</p>
  <div class="two"><label class="f"><span>التاريخ</span><input id="b_date" type="date" value="${B.date}"></label><label class="f"><span>${isCnt(p)?`كام ${pcN(p)}`:'طلع كام كيلو'}</span><input id="b_yieldKg" type="number" inputmode="decimal"></label></div>
  <div class="two"><label class="f"><span>دفعت في الخامة (اختياري)</span><input id="b_raw" type="number" inputmode="decimal"></label><label class="f"><span>اليومية (اختياري)</span><input id="b_labor" type="number" inputmode="decimal" value="${B.labor}"></label></div>
  ${packCalcHTML(p,'bpc')}<label class="f"><span>ملاحظة (عدد الكرنبات، نوع الطماطم…)</span><input id="b_note"></label>
  <div id="bcalc" class="card sumc"></div><button class="btn o full" data-save>احفظ التجهيزة</button>
  <div class="h2">التجهيزات اللي فاتت</div><div id="bprev">${prev()||'<div class="note">لسه مفيش.</div>'}</div>`);
  const calc=()=>{const y=n0(B.yieldKg),c=n0(B.raw)+n0(B.labor);
    $('#bcalc').innerHTML=y>0&&c>0?`<div class="row"><span>${isCnt(p)?'ال'+pcN(p):'الكيلو'} طلع عليك</span><b class="num">${fmt1(c/y)} جنيه</b></div><div class="note">الوحدة (${esc(p.unit)}) بالتغليف ≈ ${fmt1(c/y*(n0(p.unitKg)||1)+n0(p.pack))} · بتتباع ${fmt(n0(p.price))}</div>`:n0(B.yieldKg)>0?'<span class="note">هتتضاف للمخزن من غير تكلفة.</span>':'<span class="note">اكتب الكمية.</span>'};

  packCalcBind(p,'bpc',v=>{B.yieldKg=v;$('#b_yieldKg').value=v;calc()});

/* ---------- plates calculator ---------- */
function packCalcHTML(p,id){const c=isCnt(p),dz=sizesOf(p).map(z=>z.kg);
  return `<div class="card sumc" id="${id}"><div class="row"><b>احسبها بالأطباق</b><button class="btn ghost" data-pcadd="${id}" style="min-height:34px;padding:2px 10px;font-size:13px">+ حجم</button></div>
  <p class="note" style="margin:4px 0 8px">اكتب كام طبق من كل حجم، والإجمالي يتحسب لوحده (مثلًا 5 أطباق 500 جرام + 2 كيلو + 3 أطباق 450).</p>
  <div class="pcrows"></div><div class="pctot note" style="font-weight:800;margin-top:6px"></div></div>`}
function packCalcBind(p,id,onTotal){const c=isCnt(p),box=$('#'+id);if(!box)return;
  const rows=[...new Set(sizesOf(p).map(z=>n0(z.kg)))].map(kg=>({n:'',size:c?kg:Math.round(kg*1000)}));if(!rows.length)rows.push({n:'',size:c?1:500});
  const draw=()=>{box.querySelector('.pcrows').innerHTML=rows.map((r,i)=>`<div class="orow" style="grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto 44px;align-items:center"><input data-pcn="${i}" type="number" inputmode="decimal" placeholder="عدد" value="${r.n}"><span class="note">طبق ×</span><input data-pcs="${i}" type="number" inputmode="decimal" value="${r.size}"><span class="note">${c?pcN(p):'جرام'}</span><button class="xbtn" data-pcrm="${i}" aria-label="شيل">×</button></div>`).join('');tot()};
  const tot=()=>{const t=rows.reduce((a,r)=>a+n0(r.n)*n0(r.size),0),v=c?t:t/1000,plates=rows.reduce((a,r)=>a+n0(r.n),0);
    box.querySelector('.pctot').textContent=plates?`${plates} طبق = ${c?fmt1(v)+' '+pcN(p):kgTxt(v)}`:'';if(plates)onTotal(Math.round(v*1000)/1000)};
  box.addEventListener('input',e=>{const d=e.target.dataset;if(d.pcn!=null){rows[d.pcn].n=e.target.value;tot()}if(d.pcs!=null){rows[d.pcs].size=e.target.value;tot()}});
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();if(b.dataset.pcadd){rows.push({n:'',size:''});draw()}else if(b.dataset.pcrm!=null){rows.splice(+b.dataset.pcrm,1);draw()}});
  draw()}

function openMoves(p){
  const draw=()=>{const st=sStart();
    const mv=[...S.batches.filter(b=>b.productId===p.id).map(b=>({t:'b',id:b.id,date:b.date,kg:bKg(b,p),label:b.units!=null?`استلام ${fmt1(n0(b.units))} ${p.unit}`:n0(b.raw)>0?`تجهيزة: خامة ${fmt(n0(b.raw))} + يومية ${fmt(n0(b.labor))}`:'تجهيزة (من غير تكلفة)',edit:b.units!=null?'units':'yieldKg',val:b.units!=null?n0(b.units):n0(b.yieldKg)})),
      ...S.adjust.filter(a=>a.productId===p.id).map(a=>({t:'a',id:a.id,date:a.date,kg:n0(a.delta),label:'جرد (تظبيط)',edit:'delta',val:n0(a.delta)})),
      ...S.expenses.filter(e=>e.cat==='waste'&&e.productId===p.id).map(e=>({t:'w',id:e.id,date:e.date,kg:-n0(e.qty)*uKg(p),label:`هالك ${fmt1(n0(e.qty))} ${p.unit}`}))]
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    $('#mvlist').innerHTML=mv.length?mv.map(x=>`<div class="it" style="cursor:default;align-items:center"><div><b class="num">${esc(x.date)}</b>${(x.date||'')<st&&x.t!=='a'?' <span class="pill">قبل بداية المخزن</span>':''}<div class="note">${esc(x.label)}</div>
      ${x.edit?`<div class="step" style="margin-top:6px"><input data-mvv="${x.t}:${esc(x.id)}:${x.edit}" type="number" inputmode="decimal" value="${x.val}" style="width:90px"><span class="note">${x.edit==='units'?esc(p.unit):'كيلو'}</span><button data-mvsave="${x.t}:${esc(x.id)}:${x.edit}" style="width:auto;padding:0 12px;font-size:14px">حفظ</button></div>`:''}</div>
      <div class="end"><b class="num" style="color:${x.kg<0?'var(--red)':'var(--g2)'}">${x.kg>0?'+':''}${qTxt(p,x.kg)}</b>${isOwner()?`<br><button class="btn del" data-mvdel="${x.t}:${esc(x.id)}" style="min-height:36px;padding:2px 6px">مسح</button>`:""}</div></div>`).join('')
      :'<div class="empty">مفيش حركات متسجلة.</div>'};
  openSheet(`<div class="row"><h2 class="h" style="margin:0">حركات ${esc(p.name)}</h2><button class="btn ghost" data-close>قفل</button></div>
  <p class="note">لو دخلت حاجة غلط عدّل الرقم واضغط حفظ، أو امسحها. البيع بيتخصم من الأوردرات نفسها.</p><div id="mvlist"></div>`);
  draw();
  const col={b:'batches',a:'adjust',w:'expenses'};
  sheetIn.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if('close' in b.dataset)return closeSheet();
    if(b.dataset.mvsave){const [t,id,f]=b.dataset.mvsave.split(':'),inp=sheetIn.querySelector(`[data-mvv="${b.dataset.mvsave}"]`),v=n0(inp.value);
      if(f!=='delta'&&!(v>0)){toast('اكتب رقم صحيح');return}
      try{await db.collection(col[t]).doc(id).update({[f]:v});toast('اتعدل ✓');setTimeout(draw,300)}catch(_){toast('ماتحفظش، جرب تاني')}}
    else if(b.dataset.mvdel){const [t,id]=b.dataset.mvdel.split(':');confirmDo(b,async()=>{if(await del(col[t],id))setTimeout(draw,300)})}}}

/* ---------- count (جرد) ---------- */
function openCount(p){

  openSheet(`<div class="row"><h2 class="h" style="margin:0">جرد ${esc(p.name)}</h2><button class="btn ghost" data-close>قفل</button></div>
  <p class="note">الدفتر حاسب إن عندك <b class="num">${qTxt(p,cur)}</b> ${packTxt(p,cur)}. عدّ اللي عندك فعلًا واكتبه، والفرق هيتظبط لوحده.</p>
  ${uKg(p)!==1?`<div class="seg2"><button data-cm="pk" class="on">بالعلبة (${esc(p.unit)})</button><button data-cm="kg">${isCnt(p)?'بال'+pcN(p):'بالكيلو'}</button></div>`:''}
  <label class="f"><span id="c_l">الموجود فعلًا ${uKg(p)!==1?`(عدد العلب ${esc(p.unit)})`:(isCnt(p)?`(${pcN(p)})`:'(كيلو)')}</span><input id="c_v" type="number" inputmode="decimal"></label>
  ${packCalcHTML(p,'cpc')}
  <div id="cdiff" class="note"></div><button class="btn o full" data-save>ظبط المخزن</button>`);
  const kgv=()=>mode==='kg'?n0(v):n0(v)*uKg(p);
  const show=()=>{const d=kgv()-cur;$('#cdiff').textContent=v===''?'':Math.abs(d)<1e-6?'مظبوط ✓':`الفرق ${d>0?'+':''}${qTxt(p,d)}`};
  sheetIn.oninput=e=>{if(e.target.id==='c_v'){v=e.target.value;show()}};
  packCalcBind(p,'cpc',x=>{if(mode!=='kg'){mode='kg';sheetIn.querySelectorAll('[data-cm]').forEach(b=>b.classList.toggle('on',b.dataset.cm==='kg'));$('#c_l').textContent=`الموجود فعلًا (${isCnt(p)?pcN(p):'كيلو'})`}v=String(x);$('#c_v').value=x;show()});
  sheetIn.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if('close' in b.dataset)return closeSheet();
    if(b.dataset.cm){mode=b.dataset.cm;sheetIn.querySelectorAll('[data-cm]').forEach(x=>x.classList.toggle('on',x===b));$('#c_l').textContent=mode==='kg'?`الموجود فعلًا (${isCnt(p)?pcN(p):'كيلو'})`:`الموجود فعلًا (عدد العلب ${p.unit})`;show();return}
    if('save' in b.dataset){if(v===''){toast('اكتب العدد');return}const d=kgv()-cur;if(Math.abs(d)<1e-6){closeSheet();return}b.disabled=true;
      const ok=await save('adjust',null,{productId:p.id,delta:d,date:today(),createdAt:Date.now()});b.disabled=false;if(ok)closeSheet()}}}

function openOffer(o){
  const O=o?clone(o):{name:'',price:'',items:[{productId:'',qty:1}]};O.items=O.items||[];O.web=owebOf(O);
  const opts=sel=>`<option value="">اختار…</option>`+sortP(S.products).map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.unit)})</option>`).join('');
  const rows=()=>O.items.map((it,i)=>`<div class="orow"><select data-ip="${i}">${opts(it.productId)}</select><input data-iq="${i}" type="number" inputmode="decimal" step="0.5" value="${n0(it.qty)}"><button class="xbtn" data-rm="${i}" aria-label="شيل">×</button></div>`).join('');
  openSheet(`<div class="row"><h2 class="h" style="margin:0">${o?'تعديل عرض':'عرض جديد'}</h2><button class="btn ghost" data-close>قفل</button></div>
  <div class="two" style="margin-top:12px"><label class="f"><span>اسم العرض</span><input id="o_name" value="${esc(O.name)}"></label><label class="f"><span>سعر العرض</span><input id="o_price" type="number" inputmode="decimal" value="${esc(O.price)}"></label></div>
  <div class="h2">العرض فيه إيه</div><p class="note" style="margin-top:0">الكمية بوحدة المنتج: ورق العنب وحدته 500 جرام، فالكيلو يبقى 2.</p>
  <div id="orows">${rows()}</div><button class="btn ghost full" data-addi>+ صنف</button>
  <div id="ocalc" class="card sumc"></div>
  <div class="card sumc" style="padding:10px 12px;margin:10px 0"><div class="h2" style="margin-top:0">🌐 على الموقع</div><div id="owebbox"></div></div>
  <button class="btn o full" data-save>احفظ العرض</button>${o?'<button class="btn del full" data-del>امسح العرض</button>':''}`);
  const calc=()=>{const {c,miss}=offerCost(O),sep=O.items.reduce((s,it)=>{const p=prod(it.productId);return s+(p?n0(p.price)*n0(it.qty):0)},0),pr=n0(O.price)-c;
    $('#ocalc').innerHTML=`<div class="row"><span>لو اتباعوا لوحدهم</span><b class="num">${fmt(sep)}</b></div><div class="row"><span>الزبون بيوفر</span><b class="num">${fmt(sep-n0(O.price))}</b></div>
    <div class="row"><span>التكلفة ${miss?'(ناقصة)':fmt(c)}</span><b style="color:${mColor(n0(O.price)?pr/n0(O.price)*100:0)}">الربح ${miss?'—':`${fmt(pr)} (${n0(O.price)?Math.round(pr/n0(O.price)*100):0}%)`}</b></div>`};
  const oweb=()=>{const w=O.web,ch=(v,l)=>`<button type="button" class="chip ${w.show===v?'o':''}" data-ows="${v}">${l}</button>`;
    $('#owebbox').innerHTML=`<div class="chips">${ch(true,'✅ يظهر على الموقع')}${ch(false,'🚫 مش ظاهر')}</div>
    ${w.show?`<label class="f" style="margin-top:8px"><span>اسمه على الموقع (فاضي = نفس الاسم)</span><input id="ow_title" value="${esc(w.title)}" placeholder="${esc(O.name)}"></label>
    <label class="f"><span>كلمة فوق الكارت (اختياري)</span><input id="ow_tag" value="${esc(w.tag)}" placeholder="مثلًا: 🔥 الأكثر طلبًا"></label>
    <label class="f"><span>الأصناف زي ما تظهر للزبون (سطر لكل صنف، فاضي = يتكتب لوحده)</span><textarea id="ow_text" rows="4" placeholder="${esc(offerAuto(O).join('\n'))}">${esc(w.text)}</textarea></label>
    <p class="note" style="margin:0">لو صنف من أصناف العرض خلص من المخزن، العرض بيتعامل زيه: يا "خلص · بيرجع قريب" يا يتشال.</p>`:''}`};
  calc();oweb();
  sheetIn.oninput=e=>{const t=e.target;if(t.id==='ow_title'){O.web.title=t.value;return}if(t.id==='ow_tag'){O.web.tag=t.value;return}if(t.id==='ow_text'){O.web.text=t.value;return}
    if(t.id==='o_name')O.name=t.value;if(t.id==='o_price')O.price=t.value;if(t.dataset.ip)O.items[t.dataset.ip].productId=t.value;if(t.dataset.iq)O.items[t.dataset.iq].qty=n0(t.value);calc()};
  sheetIn.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if('close' in b.dataset)closeSheet();
    else if(b.dataset.ows){O.web.show=b.dataset.ows==='true';oweb()}
    else if('addi' in b.dataset){O.items.push({productId:'',qty:1});$('#orows').innerHTML=rows()}
    else if(b.dataset.rm){O.items.splice(+b.dataset.rm,1);$('#orows').innerHTML=rows();calc()}
    else if('save' in b.dataset){const items=O.items.filter(it=>it.productId&&n0(it.qty)>0).map(it=>({productId:it.productId,qty:n0(it.qty)}));
      if(!String(O.name).trim()||!(n0(O.price)>0)||!items.length){toast('اكتب الاسم والسعر واختار الأصناف');return}
      const keep=o?{...o}:{};delete keep.id;
      b.disabled=true;const ok=await save('offers',o?o.id:null,{...keep,name:String(O.name).trim(),price:n0(O.price),items,order:n0(O.order),web:{...O.web,title:String(O.web.title||'').trim(),tag:String(O.web.tag||'').trim(),text:String(O.web.text||'').trim()}});b.disabled=false;if(ok)closeSheet()}
    else if('del' in b.dataset)confirmDo(b,async()=>{if(await del('offers',o.id))closeSheet()})}}

  if(d.custnew){const c=customers().find(x=>x.key===d.custnew);openOrder(null);if(c){[['name','f_name'],['phone','f_phone'],['phone2','f_phone2'],['area','f_area'],['address','f_address']].forEach(([k,f])=>{const el=$('#'+f);if(el&&c[k]){el.value=c[k];F[k]=c[k]}});fillCust('f_phone')}return}

  if('pubnow' in d){publishSite(true);return}
  if(d.osort){S.osort=d.osort;ls.set('osort',d.osort);drawOrders();return}
  if(d.csort){S.csort=d.csort;ls.set('csort',d.csort);drawOrders();return}
  if(d.cedit)return openCustTag(d.cedit);
  if(d.wled)return openWLedger(d.wled);
  if('wedit' in d)return openWorker(d.wedit?(S.settings.workers||[]).find(w=>w.id===d.wedit):null);
  if(d.wpay)return payWorker(d.wpay);
  if(false){const w=null;openExp(null,'salary');setTimeout(()=>{const a=$('#e_workerId'),m=$('#e_amount'),c=$('#e_cat');if(c){c.value='salary';c.dispatchEvent(new Event('input',{bubbles:true}))}if(a){a.value=d.wpay;a.dispatchEvent(new Event('input',{bubbles:true}))}if(m&&w){m.value=Math.max(0,w.bal);m.dispatchEvent(new Event('input',{bubbles:true}))}},0);return}
  if('new' in d)return openOrder(null);
  if(d.order){if(!isStaff())return;return openOrder(S.orders.find(o=>o.id===d.order))}
  if(d.exp)return openExp(S.expenses.find(x=>x.id===d.exp));
  if('qe' in d)return openExp(null,d.qe||'ads');
  if('settings' in d)return openSettings();
  if('pedit' in d)return openProduct(d.pedit?prod(d.pedit):null);
  if(d.batch)return openBatch(prod(d.batch));

async function importFile(f){if(!f)return;let data;try{data=JSON.parse(await f.text())}catch(_){toast('الملف مش مظبوط');return}

function waChatH(){const c=waChat(),cu=waCust(c.id),m=cu?cmeta(cu.key):{},tg=CTAG[m.tag],open=waOpenWin(c),nm=waName(c);

  ${(()=>{const sm=waSmart();return sm?`<div class="wa-smart"><span class="wa-sm-ic">🧺</span><div class="wa-sm-t"><b>فهمت من رسايله:</b> ${sm.items.map(x=>esc(x.label)).join(' · ')}</div><button data-wa-smart>سجّلها أوردر</button></div>`:''})()}
  <div class="wa-quick">${waQuick().map(([l],i)=>`<button data-wa-q="${i}">${l}</button>`).join('')}<button data-wa-gal>🖼️ صور المنتجات</button></div>
  <div class="wa-comp${open?'':' off'}"><label class="wa-att" aria-label="ابعت صورة">📎<input type="file" id="waFile" accept="image/*" hidden ${open?'':'disabled'}></label>
    <textarea id="waTxt" rows="1" placeholder="${open?'اكتب رسالة…':'مقفول لحد ما الزبون يكتب'}" ${open?'':'disabled'}>${esc(ls.get('waDraft',{})[c.id]||'')}</textarea>
    <button class="wa-send" data-wa-send ${open?'':'disabled'} aria-label="ابعت"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg></button></div>
  ${open&&left<3*3600e3?`<div class="wa-warnt">⏱️ فاضل ${Math.ceil(left/3600e3)} ساعة وتتقفل المحادثة من هنا</div>`:''}`}

function waMsgH(m){const t=m.type;let b='';
  if(t==='text')b=`<div class="wa-tx">${waLinkify(m.text||'')}</div>`;
  else if(t==='image'||t==='sticker')b=`<img class="wa-img${t==='sticker'?' stk':''}" alt="" ${m.link?`src="${esc(m.link)}"`:m.media?`data-wa-media="${esc(m.media)}"`:''}>${m.text?`<div class="wa-tx">${waLinkify(m.text)}</div>`:''}`;
  else if(t==='audio')b=m.media?`<audio controls preload="none" data-wa-media="${esc(m.media)}"></audio>`:'🎤 رسالة صوتية';
  else if(t==='video')b=m.media?`<video controls preload="none" class="wa-img" data-wa-media="${esc(m.media)}"></video>${m.text?`<div class="wa-tx">${waLinkify(m.text)}</div>`:''}`:'🎬 فيديو';
  else if(t==='document')b=`<button class="wa-doc" data-wa-doc="${esc(m.media||'')}" data-name="${esc(m.text||'ملف')}">📄 ${esc(m.text||'ملف')}</button>`;
  else if(t==='location')b=`<a class="wa-doc" target="_blank" rel="noopener" href="https://maps.google.com/?q=${n0(m.lat)},${n0(m.lng)}">📍 ${esc(m.text||'لوكيشن')} · افتح الخريطة</a>`;
  else if(t==='reaction')b=`<div class="wa-tx">تفاعل ${esc(m.text||'')}</div>`;
  else b=`<div class="wa-tx note">${esc(m.text||'رسالة مش مدعومة هنا، شوفها على الموبايل')}</div>`;
  const tick=m.dir==='out'?`<span class="wa-tk ${m.st||''}">${m.st==='read'?'✓✓':m.st==='delivered'?'✓✓':m.st==='failed'?'⚠️':'✓'}</span>`:'';
  return`<div class="wa-b ${m.dir==='out'?'out':'in'}${t==='reaction'?' rx':''}"><div class="wa-bb">${b}<span class="wa-t">${m.via==='app'?'📱 ':''}${waHM(n0(m.at))}${tick}</span></div></div>`}
function waDrawMsgs(keep){const box=document.getElementById('waMsgs');if(!box)return;const L=S.waM[waCur];waSmartRefresh();
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  if(!L){box.innerHTML='<div class="wa-empty"><p>بنحمّل الرسايل…</p></div>';return}
  if(!L.length){box.innerHTML='<div class="wa-empty"><p>مافيش رسايل لسه</p></div>';return}
  let day='',h='';L.forEach(m=>{const d=waDay(n0(m.at));if(d!==day){day=d;h+=`<div class="wa-day"><span>${d}</span></div>`}h+=waMsgH(m)});box.innerHTML=h;
  if(!keep||near)box.scrollTop=box.scrollHeight;waLoadMedia(box)}
async function waLoadMedia(root){for(const el of root.querySelectorAll('[data-wa-media]')){const id=el.dataset.waMedia;if(el.dataset.ld)continue;el.dataset.ld=1;
  try{const u=await waMedia(id);el.src=u;if(el.tagName==='IMG')el.onclick=()=>waView(u)}catch(_){el.alt='الصورة مش متاحة';el.classList.add('bad')}}}
async function waMedia(id){if(waImg[id])return waImg[id];const r=await fetch(waApi()+'/media/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+await waTok()}});if(!r.ok)throw new Error('media');const u=URL.createObjectURL(await r.blob());waImg[id]=u;return u}
function waSmartRefresh(){const main=document.querySelector('.wa-main');if(!main||!waCur)return;const old=main.querySelector('.wa-smart');const sm=waSmart();
  const h=sm?`<div class="wa-smart"><span class="wa-sm-ic">🧺</span><div class="wa-sm-t"><b>فهمت من رسايله:</b> ${sm.items.map(x=>esc(x.label)).join(' · ')}</div><button data-wa-smart>سجّلها أوردر</button></div>`:'';
  if(old){if(h)old.outerHTML=h;else old.remove()}else if(h){const q=main.querySelector('.wa-quick');if(q)q.insertAdjacentHTML('beforebegin',h)}}
function waView(u){const v=document.createElement('div');v.className='wa-view';v.innerHTML=`<img src="${u}" alt="">`;v.onclick=()=>v.remove();document.body.appendChild(v)}
function waDraw(){const o=document.getElementById('wa');if(!o||o.hidden)return;const wide=innerWidth>=900;
  const ta=document.getElementById('waTxt'),hadFocus=ta&&document.activeElement===ta,val=ta?ta.value:null,box=document.getElementById('waMsgs'),sc=box?box.scrollTop:null;
  o.innerHTML=`<div class="wa-in${waCur?' chat':''}">${wide||!waCur?`<aside class="wa-side">${waList()}</aside>`:''}${waCur?`<section class="wa-main">${waChatH()}</section>`:wide?`<section class="wa-main wa-hello"><div><div style="font-size:56px">🌿</div><b>اختار محادثة</b><p class="note">الرسايل اللي بتيجي على رقم ع الفرازة بتظهر هنا</p></div></section>`:''}</div>`;
  if(waCur){waDrawMsgs(false);const t2=document.getElementById('waTxt');if(t2){if(val!=null)t2.value=val;waGrow(t2);if(hadFocus)t2.focus()}if(sc!=null&&box&&document.getElementById('waMsgs'))document.getElementById('waMsgs').scrollTop=document.getElementById('waMsgs').scrollHeight}
  const q=document.getElementById('waQ');if(q&&waQ&&!waCur){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
const waGrow=t=>{t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'};
async function waSend(body){const r=await fetch(waApi()+'/send',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await waTok()},body:JSON.stringify({to:waCur,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function waSendText(){const t=document.getElementById('waTxt');if(!t||waSending)return;const v=t.value.trim();if(!v)return;
  if(!waApi()){toast('لسه الربط ماخلصش');return}waSending=true;t.disabled=true;
  try{await waSend({text:v});t.value='';const dr=ls.get('waDraft',{});delete dr[waCur];ls.set('waDraft',dr);waGrow(t);const c=waChat();if(!c.status||c.status==='new')db.collection('wa_chats').doc(waCur).update({status:'wait'}).catch(()=>{})}
  catch(e){toast('ماتبعتتش: '+String(e.message||'').slice(0,40))}waSending=false;t.disabled=false;t.focus()}
async function waSendImg(data,mime,caption,link){if(!waApi()){toast('لسه الربط ماخلصش');return}toast('بتتبعت…');
  try{await waSend({image:link?{link}:{data,mime},caption:caption||''});toast('اتبعتت ✓')}catch(e){toast('ماتبعتتش: '+String(e.message||'').slice(0,40))}}
async function waPrep(file){const url=URL.createObjectURL(file);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});let w=im.naturalWidth,h=im.naturalHeight;const M=1600;if(w>M||h>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>2.6e6&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}return d}
function waGallery(){let cat;try{cat=buildCatalog()}catch(_){cat={products:[]}}const ps=cat.products.filter(p=>p.photo);
  openSheet(`${sheetHead('🖼️ ابعت صورة منتج')}<p class="note">اختار صورة وهتتبعت للزبون ومعاها الاسم والسعر.</p>
  <div class="wa-gal">${ps.map((p,i)=>`<button data-wa-gp="${i}"><img src="${esc(imgSrc(p.photo))}" alt="" loading="lazy"><b>${esc(p.name)}</b><small>${esc(p.unit)} · ${fmt(p.price)} ج${p.state?' · خلص':''}</small></button>`).join('')||'<p class="note">مافيش صور منتجات على الموقع لسه.</p>'}</div>`);
  sheetIn.onclick=async e=>{if(e.target.closest('[data-close]')){closeSheet();return}const b=e.target.closest('[data-wa-gp]');if(!b)return;const p=ps[+b.dataset.waGp];closeSheet();
    const cap=`*${p.name}* ${p.sub?'('+p.sub+')':''}\n${p.unit}: ${fmt(p.price)} جنيه\nاطلب من هنا: ${SITE_URL}`;
    if(p.photo.startsWith('fs:')){await loadImg(p.photo.slice(3));const d=imgSrc(p.photo);if(d)waSendImg(d,'image/jpeg',cap);else toast('الصورة مش متاحة')}else waSendImg(null,null,cap,imgSrc(p.photo))}}

async function waHealth(){if(!waApi())return null;try{return await (await fetch(waApi()+'/health')).json()}catch(_){return{ok:false}}}
async function waSettings(){const set=S.settings||{},L=set.waLinked;
  openSheet(`${sheetHead('⚙️ ربط واتساب ع الفرازة')}<div id="waSetB"><p class="note">بنشيّك على الربط…</p></div>`);
  const h=await waHealth();const box=document.getElementById('waSetB');if(!box)return;
  box.innerHTML=`<div class="wa-sec"><div class="lbl">السيرفر</div><p style="margin:0">${!waApi()?'❌ لسه ماتعملش':h&&h.ok?'✅ شغال':'⚠️ مش بيرد'}</p></div>
  <div class="wa-sec" style="margin-top:10px"><div class="lbl">رقم الواتساب</div><p style="margin:0">${h&&h.connected?`✅ متربط${L&&L.phone?' · '+esc(L.phone):''}`:'❌ لسه مش متربط'}</p></div>
  ${waApi()&&set.waAppId&&set.waConfigId?`<button class="btn o full" data-wa-link>${h&&h.connected?'🔄 اربط تاني':'🔗 اربط رقم واتساب بيزنس'}</button>
  <p class="note">هيفتحلك شباك فيسبوك. اختار حسابك، وبعدين اختار <b>"ربط تطبيق واتساب بيزنس الموجود"</b>، وامسح الكود اللي هيظهر من موبايل ع الفرازة. الرقم هيفضل شغال على الموبايل عادي.</p>`:'<p class="note">لسه الإعدادات ناقصة، هنكملها مع بعض.</p>'}
  ${h&&h.connected?'<button class="btn ghost full" data-wa-sync>📥 هات المحادثات القديمة (خلال 24 ساعة من الربط بس)</button>':''}`;
  sheetIn.onclick=async e=>{if(e.target.closest('[data-close]'))return closeSheet();
    if(e.target.closest('[data-wa-link]')){closeSheet();waConnect()}
    if(e.target.closest('[data-wa-sync]')){try{const r=await fetch(waApi()+'/sync',{method:'POST',headers:{Authorization:'Bearer '+await waTok()}});toast(r.ok?'بدأت المزامنة، استنى شوية':'ماتنفعش دلوقتي')}catch(_){toast('ماتنفعش دلوقتي')}}}}
function waFbSdk(appId){return new Promise((res,rej)=>{if(window.FB){return res(window.FB)}window.fbAsyncInit=()=>{FB.init({appId,autoLogAppEvents:true,xfbml:false,version:'v26.0'});res(FB)};
  const sc=document.createElement('script');sc.src='https://connect.facebook.net/en_US/sdk.js';sc.async=true;sc.crossOrigin='anonymous';sc.onerror=()=>rej(new Error('sdk'));document.head.appendChild(sc)})}
async function waConnect(){const set=S.settings||{};let FBx;try{FBx=await waFbSdk(String(set.waAppId))}catch(_){toast('فيسبوك مش بيحمّل، جرب تاني');return}
  let info={};const lis=e=>{try{if(!/(^|\.)facebook\.com$/.test(new URL(e.origin).hostname))return;const d=typeof e.data==='string'?JSON.parse(e.data):e.data;
    if(d&&d.type==='WA_EMBEDDED_SIGNUP'){if(/^FINISH/.test(d.event||''))info=d.data||{};else if(d.event==='CANCEL')info={cancel:d.data&&d.data.current_step||1}}}catch(_){}};
  addEventListener('message',lis);
  FBx.login(r=>{setTimeout(async()=>{removeEventListener('message',lis);const code=r&&r.authResponse&&r.authResponse.code;
    if(!code){toast(info.cancel?'اتلغى الربط':'ماكملش الربط');return}
    if(!info.waba_id){toast('فيسبوك مابعتش بيانات الرقم، جرب تاني');return}
    toast('بنربط…');try{const x=await fetch(waApi()+'/onboard',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await waTok()},body:JSON.stringify({code,waba_id:info.waba_id,phone_number_id:info.phone_number_id})});
      const j=await x.json().catch(()=>({}));if(!x.ok)throw new Error(j.error||x.status);toast('اتربط ✓ '+(j.phone||''));setTimeout(waSettings,800)}catch(e){toast('الربط ماكملش: '+String(e.message||'').slice(0,50))}},600)},
    {config_id:String(set.waConfigId),response_type:'code',override_default_response_type:true,extras:{setup:{},featureType:'whatsapp_business_app_onboarding',sessionInfoVersion:'3'}})}
function waSmart(){const L=S.waM[waCur]||[];let i=L.length-1;const ins=[];while(i>=0&&ins.length<6){const m=L[i];if(m.dir==='out')break;if(m.type==='text'||m.text)ins.unshift(m.text||'');i--}
  if(!ins.length)return null;let r;try{r=parseMsg(ins.join('\n'))}catch(_){return null}const seen={};const items=[];(r.items||[]).forEach(x=>{if(seen[x.k])seen[x.k].qty+=x.qty;else{seen[x.k]={...x};items.push(seen[x.k])}});
  return items.length?{items,addr:r.address,area:r.area}:null}
function waToOrder(items){const c=waChat(),cu=waCust(c.id);openOrder(null);F.source='واتساب';F.waChat=c.id;
  const src=$('#f_source');if(src){if(![...src.options].some(o=>o.value==='واتساب'))src.add(new Option('واتساب','واتساب'));src.value='واتساب'}
  const v={name:(cu&&cu.name)||c.name||'',phone:(cu&&cu.phone)||('0'+String(c.id).replace(/^20/,'')),area:cu&&cu.area||'',address:cu&&cu.address||''};
  [['name','f_name'],['phone','f_phone'],['area','f_area'],['address','f_address']].forEach(([k,f])=>{const el=$('#'+f);if(el&&v[k]){el.value=v[k];F[k]=v[k];el.dispatchEvent(new Event('input',{bubbles:true}))}});
  if(Array.isArray(items)&&items.length){items.forEach(x=>{F.cart[x.k]=(F.cart[x.k]||0)+n0(x.qty)});try{drawCart()}catch(_){}}
  db.collection('wa_chats').doc(c.id).update({status:'ordered'}).catch(()=>{})}
function waBind(o){
  o.addEventListener('click',e=>{const t=e.target;let b;
    if(t.closest('[data-wa-close]'))return history.back();
    if(t.closest('[data-wa-back]'))return history.back();
    if(b=t.closest('[data-wa-open]'))return waPick(b.dataset.waOpen);
    if(b=t.closest('[data-wa-f]')){waFilt=b.dataset.waF;return waDraw()}
    if(t.closest('[data-wa-card]')){waCard=!waCard;return waDraw()}
    if(b=t.closest('[data-wa-st]')){db.collection('wa_chats').doc(waCur).update({status:b.dataset.waSt}).then(()=>toast('اتغيّرت ✓')).catch(()=>toast('ماتغيرتش'));return}
    if(b=t.closest('[data-wa-tag]')){const cu=waCust(waCur);if(cu)setCust(cu.key,{tag:b.dataset.waTag,name:cu.name});return}
    if(b=t.closest('[data-wa-ord]')){const ord=S.orders.find(x=>x.id===b.dataset.waOrd);if(ord)openOrder(ord);return}
    if(t.closest('[data-wa-order]'))return waToOrder();
    if(t.closest('[data-wa-smart]')){const sm=waSmart();return waToOrder(sm?sm.items:[])}
    if(t.closest('[data-wa-set]'))return waSettings();
    if(t.closest('[data-wa-send]'))return waSendText();
    if(t.closest('[data-wa-gal]'))return waGallery();
    if(b=t.closest('[data-wa-q]')){const q=waQuick()[+b.dataset.waQ];const ta=document.getElementById('waTxt');if(q&&ta&&!ta.disabled){ta.value=ta.value.trim()?ta.value.trim()+'\n'+q[1]:q[1];waGrow(ta);ta.focus()}else if(q){try{navigator.clipboard.writeText(q[1]);toast('اتنسخ ✓ ابعته من الموبايل')}catch(_){}}return}
    if(b=t.closest('[data-wa-doc]')){if(b.dataset.waDoc)waMedia(b.dataset.waDoc).then(u=>{const a=document.createElement('a');a.href=u;a.download=b.dataset.name||'file';a.click()}).catch(()=>toast('الملف مش متاح'));return}});
  o.addEventListener('input',e=>{if(e.target.id==='waQ'){waQ=e.target.value;const r=o.querySelector('.wa-side');if(r){const ss=r.scrollTop;waDraw();const r2=o.querySelector('.wa-side');if(r2)r2.scrollTop=ss}}
    if(e.target.id==='waTxt'){waGrow(e.target);const dr=ls.get('waDraft',{});dr[waCur]=e.target.value;ls.set('waDraft',dr)}});
  o.addEventListener('keydown',e=>{if(e.target.id==='waTxt'&&e.key==='Enter'&&!e.shiftKey&&innerWidth>=900){e.preventDefault();waSendText()}});
  o.addEventListener('change',async e=>{if(e.target.id!=='waFile'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';
    try{const d=await waPrep(f);const ta=document.getElementById('waTxt'),cap=ta?ta.value.trim():'';await waSendImg(d,'image/jpeg',cap);if(ta&&cap){ta.value='';waGrow(ta)}}catch(_){toast('الصورة ماتقريتش')}})}
addEventListener('resize',()=>{if(waIsOpen())waDraw()});

</script>
<style>#instBar[hidden],#instHow[hidden],.pcnb[hidden]{display:none!important}.pcnb{display:flex;gap:8px;margin-top:6px}#instSteps{color:inherit;font-size:16px}</style>
<div id="instBar" hidden style="position:fixed;left:12px;right:12px;bottom:84px;z-index:70;background:var(--card);border:1px solid var(--o);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center">
  <img src="icon-192.png" alt="" style="width:44px;height:44px;border-radius:12px;flex:none">
  <div style="flex:1;min-width:0"><b style="display:block">ثبّت الدفتر على موبايلك</b><span style="font-size:13px;opacity:.75">يفتح زي التطبيق من الشاشة الرئيسية</span></div>
  <button id="instGo" style="flex:none;border:0;border-radius:12px;background:var(--o);color:#fff;font:800 15px Cairo,sans-serif;padding:10px 14px;cursor:pointer">ثبّت</button>
  <button id="instX" aria-label="قفل" style="flex:none;border:0;background:none;font-size:22px;color:inherit;opacity:.6;cursor:pointer">×</button>
</div>
<div id="instHow" hidden style="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center" role="dialog" aria-modal="true">
  <div style="background:var(--card);width:min(520px,100%);border-radius:22px 22px 0 0;padding:22px 18px 30px">
    <b style="font-size:20px;display:block;margin-bottom:10px">إزاي تثبّت الدفتر</b>
    <div id="instSteps" style="line-height:2"></div>
    <button id="instOk" style="margin-top:14px;width:100%;border:0;border-radius:14px;background:var(--o);color:#fff;font:800 16px Cairo,sans-serif;padding:12px;cursor:pointer">تمام</button>
  </div>
</div>
<script>
(function(){
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ua=navigator.userAgent,iOS=/iPhone|iPad|iPod/.test(ua),inApp=/FBAN|FBAV|Instagram|WhatsApp/i.test(ua);
  const bar=document.getElementById('instBar'),how=document.getElementById('instHow');let dp=null;
  const dismissed=()=>{try{return +localStorage.getItem('fz_instX')>Date.now()}catch(_){return false}};
  const show=()=>{if(!standalone&&!dismissed())bar.hidden=false};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;show()});
  window.addEventListener('appinstalled',()=>{bar.hidden=true;dp=null});
  if(iOS&&!standalone)setTimeout(show,1500);
  const steps=()=>iOS?(inApp?'١. افتح اللينك في <b>سفاري</b> (من ⋯ اختار فتح في سفاري)<br>٢. دوس زرار المشاركة <b>⬆︎</b> تحت<br>٣. اختار <b>"إضافة إلى الشاشة الرئيسية"</b>':'١. دوس زرار المشاركة <b>⬆︎</b> اللي تحت في سفاري<br>٢. انزل واختار <b>"إضافة إلى الشاشة الرئيسية"</b><br>٣. دوس <b>"إضافة"</b>'):'١. دوس على <b>⋮</b> فوق في كروم<br>٢. اختار <b>"تثبيت التطبيق"</b> أو <b>"إضافة إلى الشاشة الرئيسية"</b>';
  document.getElementById('instGo').onclick=async()=>{if(dp){dp.prompt();const r=await dp.userChoice.catch(()=>null);dp=null;if(r&&r.outcome==='accepted')bar.hidden=true;return}
    document.getElementById('instSteps').innerHTML=steps();how.hidden=false};
  document.getElementById('instX').onclick=()=>{bar.hidden=true;try{localStorage.setItem('fz_instX',Date.now()+3*864e5)}catch(_){}};
  document.getElementById('instOk').onclick=()=>{how.hidden=true};
  how.onclick=e=>{if(e.target===how)how.hidden=true};
  window.fzInstall=()=>{bar.hidden=true;document.getElementById('instGo').click()};
})();
</script>
</body>
