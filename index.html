<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر ع الفرازة</title>
<meta name="theme-color" content="#1f523e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a grocer's daily ledger — practical, warm, fast to use one-handed
   IDEA: the shop's notebook (كشكول الحساب) turned into a phone app
   PICTURE: the big net-profit figure with the break-even meter under it
   COLOUR and TYPE: ع الفرازة logo green #1f523e, leaf #769e64, orange #f47b20 on cream; Baloo Bhaijaan 2 (rounded like the logo) + Cairo
   LAYOUT: green header band, one column of cards, fixed bottom tab bar, bottom sheets for forms */
:root{color-scheme:light dark;
--bg:light-dark(#f6f3ea,#0e1611);--card:light-dark(#ffffff,#16211a);--ink:light-dark(#18261d,#ecf2ec);--mut:light-dark(#66756b,#9fb0a4);
--line:light-dark(#e6e1d3,#26352b);--g:#1f523e;--leaf:#769e64;--g2:light-dark(#1f523e,#8cc274);--disp:"Baloo Bhaijaan 2",Cairo,sans-serif;--o:#f47b20;--o2:light-dark(#c2560a,#ff9b4d);--red:light-dark(#c0392b,#ff7a6b);
--soft:light-dark(#ebf1e6,#1a2a21);--osoft:light-dark(#fff1e6,#2e2015);--rsoft:light-dark(#fdecea,#33191a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.top{background:var(--g);color:#fff;padding:14px 16px 16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand img{display:block;height:46px;width:auto}
.brand small{display:block;margin-top:2px;font-family:var(--disp);font-weight:700}
.brand small{opacity:.9;font-size:15px}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.13);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:9px;white-space:nowrap;min-height:40px;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:var(--g)}
.seg2{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;min-height:40px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;font-size:15px}
.seg2 button.on{background:var(--card);color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{border-top:6px solid var(--o)}
.big{font-family:var(--disp);font-size:clamp(42px,12vw,62px);font-weight:800;line-height:1.05;margin:4px 0}
.pos{color:var(--g2)}.neg{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:13px;color:var(--mut)}.stat b{font-family:var(--disp);font-size:22px;font-weight:800}
.h{font-family:var(--disp);font-size:21px;font-weight:800;margin:0 0 8px;line-height:1.3}
.h2{font-size:15px;font-weight:800;margin:14px 0 8px}
.meter{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}.meter i{display:block;height:100%;background:var(--o);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.end{text-align:left;flex:none}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--g2);font-weight:700;white-space:nowrap}
.pill.o{background:var(--osoft);color:var(--o2)}.pill.r{background:var(--rsoft);color:var(--red)}
.btn{border:0;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;font-size:15px}
.btn.o{background:var(--o)}.btn.ghost{background:var(--soft);color:var(--g2)}.btn.del{background:none;color:var(--red)}
.btn.full{width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--mut);min-height:54px;cursor:pointer;padding:2px}
.nav button.on{color:var(--g2)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .plus i{width:54px;height:54px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 16px rgba(244,123,32,.45)}
.nav .plus i svg{width:28px;height:28px;stroke-width:2.6}
.sheet{position:fixed;inset:0;z-index:10}.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-in{position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
@media(prefers-reduced-motion:no-preference){.sheet-in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;min-height:42px;font-weight:700;cursor:pointer;font-size:14px}
.chip small{color:var(--o2);font-weight:800;margin-inline-start:4px}
.chip.o{border-color:var(--o);background:var(--osoft)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);color:var(--g2);font-size:22px;font-weight:800;cursor:pointer;line-height:1}
.step input{width:62px;text-align:center;padding:4px;min-height:40px}
.sumc{background:var(--soft);border:0;margin-top:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.note{font-size:13px;color:var(--mut)}
.warn{background:var(--osoft);color:var(--o2);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:6px;align-items:center;margin-bottom:8px}
.xbtn{width:44px;height:44px;border:0;border-radius:10px;background:var(--rsoft);color:var(--red);font-size:20px;cursor:pointer}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border:0;color:#fff;border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;cursor:pointer;font:700 14px Cairo,sans-serif}
.me img,.me i{width:32px;height:32px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-style:normal;font-weight:800}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}
.login .card{max-width:420px;padding:32px 24px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:12px;padding:10px 20px;min-height:50px;font:700 16px Cairo,sans-serif;cursor:pointer}
.gbtn svg{width:22px;height:22px}
.role{font-size:12px;font-weight:800;padding:1px 10px;border-radius:99px;background:var(--soft);color:var(--g2)}
.by{font-size:12px;color:var(--mut)}
body.noauth .nav,body.noauth #period{display:none}
@media(max-width:420px){.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bar{grid-template-columns:minmax(0,6.5em) minmax(0,1fr) auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap brand">
  <div><img src="logo-white.png" alt="ع الفرازة"><small>دفتر الحسابات</small></div>
  <button class="me" id="meBtn" hidden></button>
  <div class="seg" id="period">
    <button data-p="week">آخر 7 أيام</button><button data-p="month">الشهر ده</button><button data-p="last">الشهر اللي فات</button><button data-p="all">من الأول</button>
  </div>
</div></header>
<main id="app" class="wrap"><div class="card empty">بيحمّل الدفتر…</div></main>
<nav class="nav"><div class="wrap">
  <button data-tab="home" data-roles="owner staff"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>الأوردرات</button>
  <button class="plus" data-roles="owner staff" data-new aria-label="أوردر جديد"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>أوردر</button>
  <button data-tab="exp" data-roles="owner"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>المصاريف</button>
  <button data-tab="stock" data-roles="owner staff"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8M7 17h10"/></svg>المخزن</button>
  <button data-tab="items" data-roles="owner"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>المنتجات</button>
</div></nav>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-in" id="sheetIn"></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot,query,where,getDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
import {FIREBASE_CONFIG,BOSS_EMAIL} from './config.js';
{
const fbApp=initializeApp(FIREBASE_CONFIG), auth=getAuth(fbApp);
let fs;try{fs=initializeFirestore(fbApp,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=initializeFirestore(fbApp,{ignoreUndefinedProperties:true})}
const ME={email:'',name:'',photo:'',role:''};
const stamp=d=>({...d,_by:ME.email,_at:Date.now()});
const wrapQ=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
function mkDoc(c,id){const r=doc(fs,c,id);return{set:d=>setDoc(r,stamp(d)),update:d=>updateDoc(r,stamp(d)),delete:()=>deleteDoc(r),
  onSnapshot:(n,e)=>onSnapshot(r,{includeMetadataChanges:true},x=>n({exists:x.exists(),data:()=>x.data(),metadata:x.metadata}),e)}}
function mkCol(c,filters){const q=filters?query(collection(fs,c),...filters):collection(fs,c);
  return{doc:id=>mkDoc(c,id),add:d=>addDoc(collection(fs,c),stamp(d)),onSnapshot:(n,e)=>onSnapshot(q,{includeMetadataChanges:true},x=>n(wrapQ(x)),e)}}
const FDB={collection:(c,f)=>mkCol(c,f),doc:p=>{const [c,id]=p.split('/');return mkDoc(c,id)}};
const isOwner=()=>ME.role==='owner', isStaff=()=>ME.role==='owner'||ME.role==='staff', isDriver=()=>ME.role==='driver';
const isOwnerUI=()=>isOwner(), isStaffUI=()=>isStaff();
const ROLES={owner:'مالك',staff:'موظف',driver:'مندوب'};
const DEF={adsDaily:100,fixed:[{name:'كهربا',amount:800}]};
const S={customers:[],users:[],auth:'loading',products:[],offers:[],orders:[],expenses:[],batches:[],supplies:[],adjust:[],settings:DEF,period:'month',tab:'home',of:'new',iv:'p',ready:false,err:''};
let db=null;
const $=s=>document.querySelector(s), app=$('#app'), sheet=$('#sheet'), sheetIn=$('#sheetIn');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:0};
const fmt=v=>v==null||!Number.isFinite(v)?'—':Math.round(v).toLocaleString('en-US');
const fmt1=v=>v==null||!Number.isFinite(v)?'—':(Math.round(v*10)/10).toLocaleString('en-US');
const pad=x=>String(x).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const SRC=['فيسبوك','تيك توك','واتساب','زبون قديم','أخرى'];
const CAT={ads:'إعلانات',power:'كهربا',pack:'تغليف واسترتش',fuel:'بنزين ومواصلات',waste:'هالك (بضاعة باظت)',salary:'مرتبات وعمولات',draw:'سحب شخصي (مرتبي)',other:'أخرى'};
const ST={done:['اتسلم',''],new:['لسه',' o'],cancel:['ملغي',' r']};
const PL={week:'آخر 7 أيام',month:'الشهر ده',last:'الشهر اللي فات',all:'من الأول'};
const clone=o=>JSON.parse(JSON.stringify(o));

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}
function openSheet(h){sheetIn.innerHTML=h;sheetIn.onclick=sheetIn.oninput=null;sheet.hidden=false;sheetIn.scrollTop=0}
function closeSheet(){sheet.hidden=true;sheetIn.innerHTML=''}
function confirmDo(b,fn){if(b.dataset.armed){fn()}else{b.dataset.armed='1';const t=b.textContent;b.textContent='متأكد؟ اضغط تاني';setTimeout(()=>{delete b.dataset.armed;b.textContent=t},3000)}}
async function save(col,id,data){
  try{if(id)await db.collection(col).doc(id).set(data);else await db.collection(col).add(data);toast('اتحفظ ✓');return true}
  catch(e){toast(e&&e.code==='quota_exceeded'?'المساحة اتملت — امسح حاجات قديمة':'ماتحفظش، جرب تاني');return false}}
async function del(col,id){try{await db.collection(col).doc(id).delete();toast('اتمسح');return true}catch(e){toast('ماتمسحش، جرب تاني');return false}}

/* ---------- costing ---------- */
const prod=id=>S.products.find(p=>p.id===id);
const offer=id=>S.offers.find(o=>o.id===id);
function batchesOf(id){return S.batches.filter(b=>b.productId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||n0(b.createdAt)-n0(a.createdAt))}
function perKg(p){
  const bs=batchesOf(p.id).filter(b=>n0(b.yieldKg)>0&&n0(b.raw)>0).slice(0,5);
  if(bs.length){const c=bs.reduce((s,b)=>s+n0(b.raw)+n0(b.labor),0),y=bs.reduce((s,b)=>s+n0(b.yieldKg),0);if(y>0)return{v:c/y,src:`متوسط آخر ${bs.length} تجهيزة`}}
  if(n0(p.yieldKg)>0)return{v:(n0(p.raw)+n0(p.labor))/n0(p.yieldKg),src:'تقديري'};return null}
function unitCost(p){if(!p)return null;if(n0(p.directCost)>0)return n0(p.directCost);const k=perKg(p);return k?k.v*(n0(p.unitKg)||1)+n0(p.pack):null}
function costSrc(p){if(n0(p.directCost)>0)return'تكلفة الوحدة ثابتة';const k=perKg(p);return k?k.src:''}
function offerCost(o){let c=0,miss=false;(o.items||[]).forEach(it=>{const u=unitCost(prod(it.productId));if(u==null)miss=true;else c+=u*n0(it.qty)});return{c,miss}}
const sizesOf=p=>p?[{label:p.unit,kg:n0(p.unitKg)||1,price:n0(p.price)},...(p.sizes||[]).filter(z=>n0(z.kg)>0&&n0(z.price)>0)]:[];
function sizeCost(p,z){if(!p)return null;if(n0(p.directCost)>0)return n0(p.directCost)*n0(z.kg)/(n0(p.unitKg)||1);const k=perKg(p);return k?k.v*n0(z.kg)+n0(p.pack):null}
function pref(ref){const [id,i]=String(ref).split('~');const p=prod(id),z=sizesOf(p)[+i||0];return{p,id,z}}
function lineCost(kind,ref){if(kind==='p'){const {p,z}=pref(ref);return z?sizeCost(p,z):null}const o=offer(ref);if(!o)return null;const r=offerCost(o);return r.miss?null:r.c}

/* ---------- stock ---------- */
const sStart=()=>S.settings.stockStart||'0000';
const uKg=p=>n0(p&&p.unitKg)||1;
const bKg=(b,p)=>b.units!=null?n0(b.units)*uKg(p):n0(b.yieldKg);
const kgTxt=v=>{const a=Math.abs(v);return (v<0?'−':'')+(a>=1||a===0?fmt1(a)+' كيلو':Math.round(a*1000)+' جرام')};
const isCnt=p=>p&&p.measure==='count', pcN=p=>(p&&p.piece)||'قطعة';
const qTxt=(p,v)=>isCnt(p)?`${v<0?'−':''}${fmt1(Math.abs(v))} ${pcN(p)}`:kgTxt(v);
const packTxt=(p,kg)=>{const u=uKg(p);return u===1?'':`≈ ${fmt1(kg/u)} ${p.unit}`};
function stockMap(){const st=sStart(),m={};S.products.forEach(p=>m[p.id]={inn:0,out:0,waste:0,adj:0});
  S.batches.forEach(b=>{if((b.date||'')>=st&&m[b.productId])m[b.productId].inn+=bKg(b,prod(b.productId))});
  S.orders.forEach(o=>{if(o.status==='cancel'||(o.date||'')<st)return;(o.lines||[]).forEach(l=>{
    if(l.kgs){Object.entries(l.kgs).forEach(([id,k])=>{if(m[id])m[id].out+=n0(k)});return}
    if(l.kind==='p'){const {p:pp,id,z}=pref(l.ref);if(m[id]&&z)m[id].out+=n0(l.qty)*n0(z.kg)}
    else{const of=offer(l.ref);if(of)(of.items||[]).forEach(it=>{if(m[it.productId])m[it.productId].out+=n0(it.qty)*uKg(prod(it.productId))*n0(l.qty)})}})});
  S.expenses.forEach(e=>{if(e.cat==='waste'&&e.productId&&(e.date||'')>=st&&m[e.productId])m[e.productId].waste+=n0(e.qty)*uKg(prod(e.productId))});
  S.adjust.forEach(a=>{if(m[a.productId])m[a.productId].adj+=n0(a.delta)});
  Object.values(m).forEach(x=>x.qty=x.inn-x.out-x.waste+x.adj);return m}
const daysAgo=d=>d?Math.floor((new Date(today())-new Date(d))/864e5):null;
function stockAlerts(){const m=stockMap(),low=[],old=[];
  S.products.forEach(p=>{const x=m[p.id];if(!x)return;const touched=x.inn||x.out||x.adj;
    if(touched&&x.qty<=n0(p.minStock))low.push(p);
    const lb=batchesOf(p.id)[0],age=lb?daysAgo(lb.date):null;if(x.qty>0&&age!=null&&age>(n0(p.shelfDays)||3))old.push({p,age})});

function calcOrder(){

/* ---------- plates calculator ---------- */
function packCalcHTML(p,id){const c=isCnt(p),dz=sizesOf(p).map(z=>z.kg);
  return `<div class="card sumc" id="${id}"><div class="row"><b>احسبها بالأطباق</b><button class="btn ghost" data-pcadd="${id}" style="min-height:34px;padding:2px 10px;font-size:13px">+ حجم</button></div>
  <p class="note" style="margin:4px 0 8px">اكتب كام طبق من كل حجم، والإجمالي يتحسب لوحده (مثلًا 5 أطباق 500 جرام + 2 كيلو + 3 أطباق 450).</p>
  <div class="pcrows"></div><div class="pctot note" style="font-weight:800;margin-top:6px"></div></div>`}
function packCalcBind(p,id,onTotal){const c=isCnt(p),box=$('#'+id);if(!box)return;
  const rows=[...new Set(sizesOf(p).map(z=>n0(z.kg)))].map(kg=>({n:'',size:c?kg:Math.round(kg*1000)}));if(!rows.length)rows.push({n:'',size:c?1:500});
  const draw=()=>{box.querySelector('.pcrows').innerHTML=rows.map((r,i)=>`<div class="orow" style="grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto 44px;align-items:center"><input data-pcn="${i}" type="number" inputmode="decimal" placeholder="عدد" value="${r.n}"><span class="note">طبق ×</span><input data-pcs="${i}" type="number" inputmode="decimal" value="${r.size}"><span class="note">${c?pcN(p):'جرام'}</span><button class="xbtn" data-pcrm="${i}" aria-label="شيل">×</button></div>`).join('');tot()};
  const tot=()=>{const t=rows.reduce((a,r)=>a+n0(r.n)*n0(r.size),0),v=c?t:t/1000,plates=rows.reduce((a,r)=>a+n0(r.n),0);
    box.querySelector('.pctot').textContent=plates?`${plates} طبق = ${c?fmt1(v)+' '+pcN(p):kgTxt(v)}`:'';if(plates)onTotal(Math.round(v*1000)/1000)};
  box.addEventListener('input',e=>{const d=e.target.dataset;if(d.pcn!=null){rows[d.pcn].n=e.target.value;tot()}if(d.pcs!=null){rows[d.pcs].size=e.target.value;tot()}});
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();if(b.dataset.pcadd){rows.push({n:'',size:''});draw()}else if(b.dataset.pcrm!=null){rows.splice(+b.dataset.pcrm,1);draw()}});
  draw()}

function openMoves(p){

async function importFile(f){if(!f)return;let data;try{data=JSON.parse(await f.text())}catch(_){toast('الملف مش مظبوط');return}
  const ops=[];COLS.forEach(c=>(data[c]||[]).forEach(x=>{if(!x||!x.id)return;const {id,...rest}=x;ops.push([c,String(id),rest])}));

  if(!ops.length){toast('الملف فاضي');return}
  toast(`بيستورد ${ops.length} حاجة…`);
  try{for(let i=0;i<ops.length;i+=400){const wb=writeBatch(fs);ops.slice(i,i+400).forEach(([c,id,d])=>wb.set(doc(fs,c,id),d,{merge:true}));await wb.commit()}
    toast('اتستورد ✓');closeSheet()}catch(e){toast('حصلت مشكلة في الاستيراد')}}

/* ---------- data ---------- */
let unsubs=[];
function startSubs(){
  const to=setTimeout(()=>{if(!S.ready){S.err='البيانات مش بتوصل دلوقتي. اتأكد من النت، واللي ظاهر ممكن يكون مش آخر نسخة.';render()}},10000);
  const sub=(col,ref)=>unsubs.push(ref.onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));
      if(!s.metadata.fromCache&&!S.ready){S.ready=true;clearTimeout(to);if(S.err.startsWith('البيانات'))S.err=''}render()},
    e=>{clearTimeout(to);console.error(col,e);S.err='حصلت مشكلة في تحميل البيانات، افتح الصفحة تاني.';render()}));
  const cols=isOwner()?COLS:isStaff()?['products','offers','orders','batches','supplies','adjust','customers']:['products','offers','orders'];
  cols.forEach(c=>sub(c,db.collection(c)));
  if(!isOwner()&&isStaff())sub('expenses',db.collection('expenses',[where('cat','==','waste')]));
  if(isOwner())sub('users',db.collection('users'));
  unsubs.push(db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?{...DEF,...d.data()}:DEF;render()},()=>{}));
}
render();
getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];S.ready=false;S.err='';closeSheet();
  COLS.concat('users').forEach(c=>S[c]=[]);
  if(!u){S.auth='out';db=null;render();return}
  ME.email=(u.email||'').toLowerCase();ME.name=u.displayName||ME.email;ME.photo=u.photoURL||'';
  if(ME.email===BOSS_EMAIL)ME.role='owner';
  else{try{const x=await getDoc(doc(fs,'users',ME.email));if(!x.exists()){S.auth='denied';render();return}const d=x.data();ME.role=d.role;if(d.name)ME.name=d.name}catch(_){S.auth='denied';render();return}}
  S.auth='in';db=FDB;S.tab=isDriver()?'orders':'home';render();startSubs();
});
}
</script>
